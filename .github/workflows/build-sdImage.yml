on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"

jobs:
  lints:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix build .#sdImage
      - uses: actions/upload-artifact@v4
        with:
          name: nixos-lpi4a-16g-sdImage
          path: result/*
